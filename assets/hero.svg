<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B1A"/><stop offset="1" stop-color="#0B1B3D"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6FDB"/><stop offset="1" stop-color="#7AC142"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6FDB" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4F8DF7" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7AC142" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sphere" cx=".35" cy=".35" r=".8">
      <stop offset="0" stop-color="#2F6FDB" stop-opacity=".45"/>
      <stop offset="1" stop-color="#050B1A" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="floorfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050B1A" stop-opacity="1"/>
      <stop offset="1" stop-color="#050B1A" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="typeclip"><rect class="typer" x="80" y="204" width="0" height="44"/></clipPath>
  </defs>

  <style>
    text{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    /* motion graphics */
    .orb1{animation:f1 9s ease-in-out infinite alternate}
    .orb2{animation:f2 11s ease-in-out infinite alternate}
    @keyframes f1{to{transform:translate(160px,40px)}}
    @keyframes f2{to{transform:translate(-180px,-30px)}}
    .scan{animation:sc 7s ease-in-out infinite}
    @keyframes sc{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
    .title{opacity:0;animation:track 1.6s .2s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes track{from{opacity:0;letter-spacing:34px}to{opacity:1;letter-spacing:8px}}
    .floor line{opacity:0;animation:floor 4s linear infinite}
    @keyframes floor{0%{opacity:0;transform:translateY(0)}15%{opacity:.5}100%{opacity:0;transform:translateY(150px)}}
    .globe{animation:bob 6s ease-in-out infinite alternate}
    @keyframes bob{to{transform:translate(900px,200px)}}
    .p{animation:rise2 7s ease-in-out infinite}
    @keyframes rise2{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-90px)}}
    .r{opacity:0;animation:cyc 12s infinite}
    .r1{animation-delay:3.5s}.r2{animation-delay:6.5s}.r3{animation-delay:9.5s}.r4{animation-delay:12.5s}
    @keyframes cyc{0%{opacity:0;transform:translateY(10px)}4%{opacity:1;transform:none}22%{opacity:1}26%,100%{opacity:0}}
    .dot{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25}}
    /* stop motion: stepped, choppy frames */
    .typer{animation:type 2.4s 1.2s steps(36,end) forwards}
    @keyframes type{to{width:560px}}
    .cursor{opacity:0;animation:cur 2.4s 1.2s steps(36,end) forwards, blink .8s 3.6s steps(1) infinite}
    @keyframes cur{0%{opacity:1;transform:translateX(0)}99%{opacity:1}100%{opacity:1;transform:translateX(560px)}}
    @keyframes blink{50%{opacity:0}}
    .sm{transform-box:fill-box;transform-origin:center;animation:boil .9s steps(1,end) infinite}
    @keyframes boil{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(2px,-2px) rotate(5deg)}50%{transform:translate(-2px,1px) rotate(-4deg)}75%{transform:translate(1px,2px) rotate(3deg)}}
    .hop{animation:hop 1.6s steps(5,end) infinite}
    @keyframes hop{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(45deg)}100%{transform:translateY(0) rotate(90deg)}}
    .b1{animation:bo 1s steps(1) infinite}.b2{animation:bo 1s steps(1) infinite reverse}
    @keyframes bo{0%{opacity:1}50%{opacity:0}}
    .ring1{animation:spin 24s linear infinite}
    .ring2{animation:spin 36s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>

  <rect width="1200" height="440" fill="url(#bg)"/>
  <circle class="orb1" cx="200" cy="140" r="150" fill="#2F6FDB" opacity=".45" filter="url(#blur)"/>
  <circle class="orb2" cx="980" cy="320" r="150" fill="#7AC142" opacity=".28" filter="url(#blur)"/>

  <!-- pseudo-3D perspective floor -->
  <g stroke="#4F8DF7" stroke-opacity=".22" stroke-width="1">
    <line x1="600" y1="270" x2="-300" y2="440"/><line x1="600" y1="270" x2="0" y2="440"/>
    <line x1="600" y1="270" x2="300" y2="440"/><line x1="600" y1="270" x2="600" y2="440"/>
    <line x1="600" y1="270" x2="900" y2="440"/><line x1="600" y1="270" x2="1200" y2="440"/>
    <line x1="600" y1="270" x2="1500" y2="440"/>
  </g>
  <g class="floor" stroke="#7AC142" stroke-width="1.2">
    <line x1="0" x2="1200" y1="280" y2="280" style="animation-delay:0s"/>
    <line x1="0" x2="1200" y1="280" y2="280" style="animation-delay:-.8s"/>
    <line x1="0" x2="1200" y1="280" y2="280" style="animation-delay:-1.6s"/>
    <line x1="0" x2="1200" y1="280" y2="280" style="animation-delay:-2.4s"/>
    <line x1="0" x2="1200" y1="280" y2="280" style="animation-delay:-3.2s"/>
  </g>
  <rect y="262" width="1200" height="40" fill="url(#floorfade)"/>

  <rect class="scan" width="300" height="440" fill="url(#scan)"/>

  <!-- pseudo-3D wireframe globe + orbit rings -->
  <g class="globe" transform="translate(900 190)">
    <g transform="rotate(-18)">
      <circle r="130" fill="url(#sphere)" stroke="#4F8DF7" stroke-opacity=".7" stroke-width="1.5"/>
      <g fill="none" stroke="#4F8DF7" stroke-opacity=".55" stroke-width="1">
        <ellipse ry="130"><animate attributeName="rx" values="0;130;0" dur="8s" begin="0s" repeatCount="indefinite"/></ellipse>
        <ellipse ry="130"><animate attributeName="rx" values="0;130;0" dur="8s" begin="-2s" repeatCount="indefinite"/></ellipse>
        <ellipse ry="130"><animate attributeName="rx" values="0;130;0" dur="8s" begin="-4s" repeatCount="indefinite"/></ellipse>
        <ellipse ry="130"><animate attributeName="rx" values="0;130;0" dur="8s" begin="-6s" repeatCount="indefinite"/></ellipse>
      </g>
      <g fill="none" stroke="#7AC142" stroke-opacity=".5" stroke-width="1">
        <ellipse cy="-80" rx="102" ry="20"/><ellipse cy="-40" rx="124" ry="25"/><ellipse rx="130" ry="26"/>
        <ellipse cy="40" rx="124" ry="25"/><ellipse cy="80" rx="102" ry="20"/>
      </g>
    </g>
    <g transform="rotate(-20)">
      <ellipse rx="200" ry="52" fill="none" stroke="#7AC142" stroke-opacity=".6" stroke-dasharray="4 8"/>
      <circle r="6" fill="#7AC142" filter="url(#glow)">
        <animateMotion dur="9s" repeatCount="indefinite" path="M-200 0A200 52 0 1 1 200 0A200 52 0 1 1 -200 0"/>
      </circle>
    </g>
    <g transform="rotate(28)">
      <ellipse rx="170" ry="40" fill="none" stroke="#4F8DF7" stroke-opacity=".5" stroke-dasharray="2 10"/>
      <circle r="5" fill="#4F8DF7" filter="url(#glow)">
        <animateMotion dur="6s" repeatCount="indefinite" path="M170 0A170 40 0 1 1 -170 0A170 40 0 1 1 170 0"/>
      </circle>
    </g>
  </g>

  <!-- rising particles -->
  <g fill="#4F8DF7">
    <circle class="p" cx="140" cy="400" r="2" style="animation-delay:0s"/>
    <circle class="p" cx="320" cy="410" r="2.5" style="animation-delay:-2s" fill="#7AC142"/>
    <circle class="p" cx="500" cy="395" r="2" style="animation-delay:-4s"/>
    <circle class="p" cx="680" cy="410" r="3" style="animation-delay:-1s" fill="#7AC142"/>
    <circle class="p" cx="1040" cy="400" r="2" style="animation-delay:-3s"/>
    <circle class="p" cx="1120" cy="410" r="2.5" style="animation-delay:-5s" fill="#7AC142"/>
  </g>

  <!-- kinetic title -->
  <text class="title" x="80" y="170" font-size="68" font-weight="700" fill="#FFFFFF">JAZARI TECH</text>

  <!-- stop-motion typed tagline -->
  <g clip-path="url(#typeclip)">
    <text x="80" y="236" font-size="26" fill="#9FB0CC" letter-spacing="2">Unleashing the Power of Possibility.</text>
  </g>
  <rect class="cursor" x="80" y="212" width="3" height="30" fill="#7AC142"/>

  <!-- boiling hand-drawn underline (2 frames) -->
  <g fill="none" stroke="url(#brand)" stroke-width="3" stroke-linecap="round">
    <path class="b1" d="M80 262Q200 257 330 263T620 261"/>
    <path class="b2" d="M80 263Q210 268 340 261T620 264"/>
  </g>

  <!-- cycling services -->
  <circle class="dot" cx="88" cy="318" r="5" fill="#7AC142"/>
  <g font-size="22" fill="#4F8DF7" font-weight="600">
    <text class="r r1" x="108" y="326">Software Engineering &amp; Web Development</text>
    <text class="r r2" x="108" y="326">AI Solutions &amp; Business Automation</text>
    <text class="r r3" x="108" y="326">ERP, SaaS &amp; POS Systems</text>
    <text class="r r4" x="108" y="326">SEO &amp; Digital Marketing</text>
  </g>

  <!-- stop-motion paper cutouts -->
  <rect class="sm" x="1110" y="50" width="26" height="26" fill="none" stroke="#7AC142" stroke-width="2"/>
  <polygon class="sm" points="700,70 720,104 680,104" fill="none" stroke="#4F8DF7" stroke-width="2" style="animation-delay:-.3s"/>
  <circle class="sm" cx="1050" cy="400" r="12" fill="none" stroke="#4F8DF7" stroke-width="2" style="animation-delay:-.6s"/>
  <rect class="hop" x="620" y="380" width="18" height="18" fill="#7AC142" opacity=".85" style="transform-box:fill-box;transform-origin:center"/>

  <text x="80" y="410" font-size="13" fill="#6B7C99" letter-spacing="4">KARACHI · PAKISTAN</text>
</svg>
